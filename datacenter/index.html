<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>機房即時監控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: isometric server room — five rack rows by tier, data flows arc overhead, ops cards float at the corners */
:root{
  --sky:#c8d4ea;
  --panel:rgba(255,255,255,.96);
  --ink:#0d1530;
  --ink-2:#3b4664;
  --ink-3:#6b7593;
  --line:#d6deed;
  --accent:#1d54ff;
  --accent-soft:#dbe5ff;
  --ok:#00965a; --ok-soft:#d2f4e3;
  --warn:#e07a00; --warn-soft:#ffecd2;
  --crit:#e0263b; --crit-soft:#ffe0e4;
  --m-cpu:#1d54ff; --m-mem:#7a4dff; --m-disk:#00a5b8;
  --shadow:0 12px 32px rgba(20,36,90,.22),0 1px 3px rgba(20,36,90,.12);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:var(--shadow);border-radius:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:8}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--ink-3);font-size:11px}
.search{position:relative;flex:1;max-width:400px}
.search label{display:flex;align-items:center;gap:8px;height:38px;padding-inline:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.pop{position:absolute;top:calc(100% + 6px);padding:6px;z-index:9}
.res{left:0;right:0}
.res button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:8px}
.res button:hover{background:var(--accent-soft)}
.res small{color:var(--ink-3)}
.spacer{flex:1}
.env{display:flex;gap:14px;align-items:center;padding:0 12px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;white-space:nowrap}
.env span{color:var(--ink-3);font-size:11.5px}
.env b{font-family:var(--f-mono);font-size:13px;color:var(--ink);margin-left:4px}
.live{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,150,90,.5)}70%{box-shadow:0 0 0 7px rgba(0,150,90,0)}100%{box-shadow:0 0 0 0 rgba(0,150,90,0)}}
.alarm{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--crit-soft);color:var(--crit);font-weight:700;white-space:nowrap}
.alarm.calm{background:var(--ok-soft);color:var(--ok)}
.user{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1d54ff,#00a5b8);color:#fff;font-weight:700}
.user b{display:block}
.user small{color:var(--ink-3);font-size:11px}

.kpis{position:absolute;top:76px;left:16px;display:flex;gap:12px;z-index:3;max-width:calc(100% - 32px)}
.kpi{display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;min-width:176px}
.ki{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ki svg{width:22px;height:22px}
.ki.c{background:var(--crit-soft);color:var(--crit)}
.kpi small{display:block;color:var(--ink-2);font-size:12px}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin-block:1px}
.kpi .v b{font-family:var(--f-mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
.kpi .v span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.kpi .sub{color:var(--ink-3);font-size:11px}

.ctl{position:absolute;top:76px;right:398px;display:flex;flex-direction:column;padding:4px;gap:2px;z-index:3}
.ctl button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.ctl button:hover{background:var(--accent-soft);color:var(--accent)}
.ctl svg{width:18px;height:18px}
.ctl hr{border:0;border-top:1px solid var(--line);margin:3px 6px}

.detail{position:absolute;top:76px;right:16px;width:370px;max-height:calc(100% - 372px);overflow:auto;padding:16px;z-index:4}
.dh{display:flex;gap:12px;align-items:center}
.dh .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--c,#1e2638);color:#fff;flex:none}
.dh .ico svg{width:24px;height:24px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.dh h2{margin:0;font-size:17px;line-height:1.3}
.dh h2.id{font-family:var(--f-mono)}
.dh p{margin:0;color:var(--ink-3);font-size:12px}
.acts{margin-left:auto;align-self:flex-start;display:flex;gap:4px}
.acts button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.acts button:hover{background:#eef2f9}
.dstate{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gauge{background:#f3f6fc;border-radius:10px;padding:9px 10px}
.gauge small{display:block;color:var(--ink-2);font-size:11.5px}
.gauge b{font-family:var(--f-mono);font-size:19px}
.gauge b.w{color:var(--warn)}
.gauge b.c{color:var(--crit)}
.bar{display:block;height:6px;background:#e3e8f2;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.chart{margin-top:12px;padding:10px;border-radius:10px;background:#f3f6fc}
.chart .ch{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
.chart .ch b{font-family:var(--f-mono);color:var(--ink)}
.chart svg{display:block;width:100%;height:56px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;text-align:right;font-weight:500;min-width:0}
.svc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.svc span{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;background:#f3f6fc;font-size:12px}
.svc span i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fix{margin-top:12px;border:1px solid #ffc9a3;background:#fff6ee;border-radius:12px;padding:12px}
.fix.c{border-color:#ffb3bd;background:#fff3f5}
.fix h4{margin:0 0 6px;font-size:13px;color:var(--warn)}
.fix.c h4{color:var(--crit)}
.fix p{margin:0 0 8px;color:var(--ink-2);line-height:1.55}
.fix .act{display:flex;justify-content:flex-end}
.btn{height:32px;padding:0 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
.btn[disabled]{background:#c7cfdf;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:#f3f6fc;border-radius:10px;padding:9px 10px}
.tile small{display:block;color:var(--ink-2);font-size:11.5px}
.tile b{font-family:var(--f-mono);font-size:17px}
.tile span{color:var(--ink-3);font-size:11.5px;margin-left:3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700}
.sec small{font-weight:400;color:var(--ink-3)}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #edf0f6}
.lst li:first-child{border-top:0}
.lst li.m{grid-template-columns:96px 1fr 44px}
.lst b{font-family:var(--f-mono)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.off{background:#2a3147;color:#fff}
.pill.mute{background:#eaeef5;color:var(--ink-3)}

.chain{position:absolute;left:16px;bottom:16px;width:min(800px,calc(100% - 468px));padding:16px;z-index:3}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.th h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.th h3 svg{width:20px;height:20px;color:var(--accent)}
.th small{color:var(--ink-3)}
ol.tiers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr)}
ol.tiers li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12px}
ol.tiers li::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:var(--c,#cfd8e8)}
ol.tiers li:first-child::before{display:none}
ol.tiers button{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
ol.tiers button svg{width:15px;height:15px}
ol.tiers b{font-weight:500}
ol.tiers small{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}

.fleet{position:absolute;right:16px;bottom:16px;width:418px;padding:12px;z-index:3;display:flex;flex-direction:column}
.tabs{display:flex;align-items:center;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs button{height:30px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button span{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px;margin-left:4px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,36,90,.2)}
.tabs .where{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.rows{overflow:auto;min-height:0;max-height:204px}
.row{width:100%;display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:10px;padding:8px 6px;border-radius:9px}
.row+.row{border-top:1px solid #edf0f6}
.row:hover{background:#f1f5fe}
.row.sel{background:var(--accent-soft)}
.row b{font-family:var(--f-mono);font-size:12px;display:block}
.row small{color:var(--ink-3);font-size:11px}
.rq{min-width:0}
.rq span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mini i{display:block;height:5px;border-radius:3px;background:#e3e8f2;overflow:hidden}
.mini i em{display:block;height:100%;background:var(--c)}

.tag{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(29,84,255,.4);white-space:nowrap}
.tag span{font-family:var(--f-body);font-weight:500;font-size:11px;background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);z-index:-1}
.tag.hov{background:#0d1530}

@media (max-width:1400px){.env{display:none}}
@media (max-width:1240px){.user div{display:none}}
@media (max-width:1060px){.chain{display:none}.live{display:none}}
@media (max-width:760px){
  .search,.user{display:none}
  .brand small{display:none}
  .kpis{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .kpi{min-width:150px}
  .kpi .v b{font-size:19px}
  .ctl{top:auto;bottom:calc(34% + 32px);right:16px}
  .fleet{left:16px;right:16px;width:auto;max-height:34%}
  .detail{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:58%;z-index:6}
  .detail.ov{display:none}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="機房 3D 即時畫面"></canvas>
  <div class="tag" id="tag" hidden></div>
  <div class="tag hov" id="hov" hidden></div>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="3" fill="#1e2638"/><rect x="8" y="7" width="16" height="3" rx="1" fill="#22c07f"/><rect x="8" y="13" width="16" height="3" rx="1" fill="#1d54ff"/><rect x="8" y="19" width="16" height="3" rx="1" fill="#f2a20c"/></svg>
      <div><b>機房即時監控</b><small>總部機房 A · 30 台主機</small></div>
    </div>
    <div class="search">
      <label><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋主機名稱、IP、用途…" autocomplete="off"><kbd>/</kbd></label>
      <div class="pop card res" id="res" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="env"><span>溫度<b id="eT">23.4°C</b></span><span>濕度<b id="eH">46%</b></span><span>電力負載<b id="eP">68%</b></span></div>
    <div class="alarm" id="alarm"></div>
    <div class="live"><i></i>即時 <span class="mono" id="clock">--:--:--</span></div>
    <div class="user"><span class="avatar">周</span><div><b>周家豪</b><small>值班工程師</small></div></div>
  </header>

  <section class="kpis" aria-label="機房指標">
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5" opacity=".6"/></svg></span><div><small>在線主機</small><div class="v"><b id="kUp">0</b><span id="kUpT"></span></div><small class="sub" id="kUpS"></small></div></div>
    <div class="kpi card"><span class="ki c"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 22 20H2z"/><rect x="11" y="9" width="2" height="6" fill="#fff"/><rect x="11" y="16.5" width="2" height="2" fill="#fff"/></svg></span><div><small>進行中告警</small><div class="v"><b id="kAl">0</b><span id="kAlT"></span></div><small class="sub" id="kAlS"></small></div></div>
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span><div><small>對外流量</small><div class="v"><b id="kNet">0</b><span>Gbps</span></div><small class="sub" id="kNetS"></small></div></div>
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6c0 1.7-3.6 3-8 3S4 7.7 4 6z" opacity=".6"/></svg></span><div><small>儲存使用率</small><div class="v"><b id="kSto">0</b><span>%</span></div><small class="sub" id="kStoS"></small></div></div>
  </section>

  <nav class="ctl card" aria-label="視角控制">
    <button id="zin" aria-label="放大" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="縮小" title="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <hr>
    <button id="rl" aria-label="向左旋轉" title="向左旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button id="rr" aria-label="向右旋轉" title="向右旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
    <button id="home" aria-label="回到全景" title="回到全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/></svg></button>
  </nav>

  <aside class="detail card" id="detail" aria-live="polite"></aside>
  <section class="chain card" id="chain"></section>
  <section class="fleet card">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="alerts" aria-selected="true">告警<span id="tAl"></span></button>
      <button role="tab" data-tab="hosts" aria-selected="false">主機<span>30</span></button>
      <button role="tab" data-tab="flows" aria-selected="false">資料流<span id="tFl"></span></button>
      <span class="where">示範資料</span>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('scene');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ===== renderer ===== */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#c8d4ea');
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -300, 500);
scene.add(new THREE.HemisphereLight('#ffffff', '#7f8db0', 0.66));
const sun = new THREE.DirectionalLight('#fffaf0', 0.8), SUN_OFF = new THREE.Vector3(-22, 40, 26);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 140 }); sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

const GC = new Map(), MC = new Map();
const G = (w, h, d) => { const k = w + '|' + h + '|' + d; if (!GC.has(k)) GC.set(k, new THREE.BoxGeometry(w, h, d)); return GC.get(k); };
function M(c, o) { if (o) return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7 }, o)); if (!MC.has(c)) MC.set(c, new THREE.MeshStandardMaterial({ color: c, roughness: .7 })); return MC.get(c); }

press($('rows'), e => { const s = e.target.closest('[data-s]'); if (s) select(S(s.dataset.s)); });
press($('chain'), e => { const b = e.target.closest('[data-tier]'); if (!b) return; const T = TIERS[+b.dataset.tier], ss = T.ids.map(S), worst = ss.find(s => s.status !== 'ok'); if (worst) select(worst); else { sel = null; const R = ROWS.find(x => x.id === T.row); view.goal = V(0, 0, R.z); view.zoomTo = 1.5; renderUI(); } });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); renderRows(); });

function searchAll(q) { q = q.trim().toLowerCase(); if (!q) return []; return SERVERS.filter(s => [s.id, s.ip, s.role, s.os].join(' ').toLowerCase().includes(q)).slice(0, 8); }
$('q').addEventListener('input', () => { const r = searchAll($('q').value), bx = $('res'); bx._r = r; bx.innerHTML = r.length ? r.map((s, i) => `<button data-i="${i}"><b class="mono">${s.id}</b><small>${s.role} · ${s.ip}</small><span class="pill ${ST[s.status][1]}">${ST[s.status][0]}</span></button>`).join('') : '<div style="padding:10px;color:var(--ink-3)">找不到符合的主機</div>'; bx.hidden = !$('q').value.trim(); });
press($('res'), e => { const b = e.target.closest('[data-i]'); if (!b) return; select($('res')._r[+b.dataset.i]); $('res').hidden = true; $('q').blur(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = searchAll($('q').value); if (r[0]) { select(r[0]); $('res').hidden = true; $('q').blur(); } } if (e.key === 'Escape') { $('res').hidden = true; $('q').blur(); } });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
const tick = () => $('clock').textContent = hhmmss(new Date()); tick(); setInterval(tick, 1000);

/* ===== loop ===== */
const tag = $('tag'), hov = $('hov');
function placeTag(el, x, y, z) { const v = V(x, y, z).project(camera); el.style.transform = `translate(${(v.x + 1) / 2 * app.clientWidth}px,${(1 - v.y) / 2 * app.clientHeight}px) translate(-50%,calc(-100% - 6px))`; }
let last = performance.now(), secAcc = 0;
function visual(dt) {
  clock += dt;
  const blink = (Math.sin(clock * 8) + 1) / 2;
  SERVERS.forEach((s, i) => {
    ['cpu', 'mem', 'disk'].forEach(k => {
      const b = s.bars[k], h = .08 + s[k] / 100 * 1.8, cur = b.scale.y || 1;
      const nh = cur + (h - cur) * Math.min(1, dt * 4); b.scale.y = nh; b.position.y = 2.92 + nh / 2;
      const w = k === 'cpu' ? 80 : 85, c = k === 'cpu' ? 90 : 95, col = lvlCol(s[k], w, c, BAR_COL[k]);
      b.material.color.set(col); b.material.emissive.set(col);
    });
    const lc = LEVEL[s.status];
    s.led.material.color.set(lc); s.led.material.emissive.set(s.status === 'off' ? '#000000' : lc);
    s.led.material.emissiveIntensity = s.status === 'crit' ? .4 + blink : .9;
    s.topPlate.material.emissive.set(s.status === 'ok' ? '#000000' : lc); s.topPlate.material.emissiveIntensity = s.status === 'ok' ? 0 : .25 + blink * .35;
    const bad = s.status === 'crit' || s.status === 'off';
    s.pin.visible = bad; s.ring.visible = s.status !== 'ok';
    s.ring.material.color.set(s.status === 'warn' ? '#f2a20c' : '#e0263b');
    if (!reduceMotion) { s.pin.position.y = 5.6 + Math.sin(clock * 2.4 + i) * .25; s.pin.rotation.y += dt; const sc = 1 + ((clock * .8 + i * .1) % 1) * .5; s.ring.scale.set(sc, sc, 1); s.ring.material.opacity = .55 * (1 - ((clock * .8 + i * .1) % 1)); }
  });
  FLOWS.forEach(f => {
    const hl = sel && (f.A === sel || f.B === sel);
    const col = f.down ? '#e0263b' : f.surge ? '#ff6a2b' : f.col;
    f.tube.material.color.set(col); f.tube.material.opacity = f.down ? .35 + blink * .4 : hl ? .9 : sel ? .18 : .45;
    const n = f.down ? 0 : clamp(Math.round(f.mbps / 140), 1, 6), sp = .12 + Math.min(1.2, f.mbps / 1500);
    f.parts.forEach((p, i) => {
      p.m.visible = i < n && !(sel && !hl && false);
      p.u = (p.u + dt * sp * (reduceMotion ? .2 : 1)) % 1;
      p.m.position.copy(f.curve.getPoint(p.u)); p.m.material.color.set(col);
      const sc = f.surge ? 1.5 : 1; p.m.scale.setScalar(sc);
    });
  });
}
function frame(t) {
  const raw = Math.max(0, (t - last) / 1000), dt = Math.min(.05, raw); last = t;
  secAcc += Math.min(raw, 2); if (secAcc >= 1) { secAcc -= 1; scen++; metricTick(); renderUI(); }
  visual(dt);
  const k = reduceMotion ? 1 : Math.min(1, dt * 5);
  view.az += (view.azTo - view.az) * k; view.zoom += (view.zoomTo - view.zoom) * k;
  if (view.goal) { view.target.lerp(view.goal, reduceMotion ? 1 : Math.min(1, dt * 3)); if (view.target.distanceTo(view.goal) < .05) view.goal = null; }
  updateCamera();
  if (sel) {
    bracket.visible = true; bracket.position.set(sel.x, .05, sel.z);
    const p = 1 + (reduceMotion ? 0 : Math.sin(clock * 4) * .03); bracket.scale.set(p, p, 1);
    tag.hidden = false; placeTag(tag, sel.x, 5.2, sel.z); tag.innerHTML = `${sel.id}<span>${ST[sel.status][0]}</span>`;
    tag.style.background = sel.status === 'ok' ? '' : sel.status === 'warn' ? '#e07a00' : '#e0263b';
  } else { bracket.visible = false; tag.hidden = true; }
  if (hover && hover !== sel) { hov.hidden = false; placeTag(hov, hover.x, 4.6, hover.z); hov.textContent = `${hover.id} · CPU ${hover.cpu.toFixed(0)}% · 記憶體 ${hover.mem.toFixed(0)}% · 磁碟 ${hover.disk.toFixed(0)}%`; } else hov.hidden = true;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); visual(0); renderUI(); requestAnimationFrame(frame);
})();
</script>

</body>
