<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>智慧客服運營中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an isometric "service floor" — citizen questions flow left to right through the intent router into five agent stations; ops cards float at the corners */
:root{
  --sky:#c8d6ee;
  --panel:rgba(255,255,255,.96);
  --ink:#0d1530;
  --ink-2:#3b4664;
  --ink-3:#6b7593;
  --line:#d6deed;
  --accent:#0a5bd8;
  --accent-soft:#dbe7ff;
  --good:#00965a;
  --good-soft:#d2f4e3;
  --warn:#e8650a;
  --warn-soft:#ffe6d2;
  --bad:#e0263b;
  --bad-soft:#ffe0e4;
  --u-rag:#1d54ff; --u-api:#00a5b8; --u-flow:#7a4dff; --u-ask:#f2a20c; --u-human:#ff6a2b;
  --shadow:0 12px 32px rgba(20,36,90,.22),0 1px 3px rgba(20,36,90,.12);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:var(--shadow);border-radius:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:8}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--ink-3);font-size:11px}
.search{position:relative;flex:1;max-width:420px}
.search label{display:flex;align-items:center;gap:8px;height:38px;padding-inline:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.pop{position:absolute;top:calc(100% + 6px);padding:6px;z-index:9}
.res{left:0;right:0}
.res button{width:100%;display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:8px;border-radius:8px}
.res button:hover{background:var(--accent-soft)}
.res .k{font-size:11px;color:var(--accent);font-weight:700}
.res small{color:var(--ink-3)}
.spacer{flex:1}
.win{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px;gap:2px}
.win button{height:32px;padding:0 12px;border-radius:7px;color:var(--ink-2);font-weight:500}
.win button[aria-pressed="true"]{background:var(--accent);color:#fff}
.live{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:700;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,150,90,.5)}70%{box-shadow:0 0 0 7px rgba(0,150,90,0)}100%{box-shadow:0 0 0 0 rgba(0,150,90,0)}}
.user{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0a5bd8,#00b3c6);color:#fff;font-weight:700}
.user b{display:block}
.user small{color:var(--ink-3);font-size:11px}

.kpis{position:absolute;top:76px;left:16px;display:flex;gap:12px;z-index:3;max-width:calc(100% - 32px)}
.kpi{display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;min-width:176px}
.ki{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ki svg{width:22px;height:22px}
.ki.g{background:var(--good-soft);color:var(--good)}
.ki.o{background:var(--warn-soft);color:var(--warn)}
.kpi small{display:block;color:var(--ink-2);font-size:12px}
.kpi .v{display:flex;align-items:baseline;gap:8px;margin-block:1px}
.kpi .v b{font-family:var(--f-mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
.kpi .v em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--good)}
.kpi .v em.dn{color:var(--bad)}
.kpi .sub{color:var(--ink-3);font-size:11px}
.hint{align-self:flex-start;color:var(--ink-2);font-size:11.5px;padding:6px 10px;white-space:nowrap;background:var(--panel);border-radius:999px;box-shadow:var(--shadow)}

.ctl{position:absolute;top:76px;right:398px;display:flex;flex-direction:column;padding:4px;gap:2px;z-index:3}
.ctl button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.ctl button:hover{background:var(--accent-soft);color:var(--accent)}
.ctl svg{width:18px;height:18px}
.ctl hr{border:0;border-top:1px solid var(--line);margin:3px 6px}

.detail{position:absolute;top:76px;right:16px;width:370px;max-height:calc(100% - 372px);overflow:auto;padding:16px;z-index:4}
.dh{display:flex;gap:12px;align-items:center}
.dh .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--c,#eef2fb);color:#fff;flex:none;font-weight:700;font-size:17px}
.dh .ico svg{width:24px;height:24px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.dh h2{margin:0;font-size:17px;line-height:1.3}
.dh h2.id{font-family:var(--f-mono)}
.dh p{margin:0;color:var(--ink-3);font-size:12px}
.acts{margin-left:auto;align-self:flex-start;display:flex;gap:4px}
.acts button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.acts button:hover{background:#eef2f9}
.quote{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#f2f5fc;font-size:13.5px;line-height:1.55}
.quote small{display:block;color:var(--ink-3);font-size:11px;margin-bottom:2px}
.quote.ans{background:#eef7f2}
.quote.ask{background:#fff4e0}
.dstate{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.bar{display:block;height:6px;background:#e3e8f2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;text-align:right;font-weight:500;min-width:0}
.conf{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.conf .bar{width:80px}
.fix{margin-top:12px;border:1px solid #ffd0b0;background:#fff6ef;border-radius:12px;padding:12px}
.fix h4{margin:0 0 6px;font-size:13px;color:var(--warn);display:flex;align-items:center;gap:6px}
.fix p{margin:0 0 8px;color:var(--ink-2);line-height:1.5}
.fix .act{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fix .act span{font-weight:700}
.btn{height:32px;padding:0 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
.btn[disabled]{background:#c7cfdf;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:#f3f6fc;border-radius:10px;padding:9px 10px}
.tile small{display:block;color:var(--ink-2);font-size:11.5px}
.tile b{font-family:var(--f-mono);font-size:17px}
.tile span{color:var(--ink-3);font-size:11.5px;margin-left:3px}
.tile .bar{margin-top:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700}
.sec small{font-weight:400;color:var(--ink-3)}
.dist{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.dist b{font-family:var(--f-mono);text-align:right}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #edf0f6}
.lst li:first-child{border-top:0}
.lst li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst b{font-family:var(--f-mono)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:#eaeef5;color:var(--ink-3)}
.pill.u{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c)}

.track{position:absolute;left:16px;bottom:16px;width:min(800px,calc(100% - 468px));display:flex;gap:16px;padding:16px;z-index:3}
.track .steps{flex:1;min-width:0}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.th h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.th h3 svg{width:20px;height:20px;color:var(--accent)}
.th small{color:var(--ink-3)}
ol.stp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
ol.stp li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;font-size:12px}
ol.stp li::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#e0e6f1}
ol.stp li:first-child::before{display:none}
ol.stp li.done::before,ol.stp li.cur::before{background:var(--accent)}
ol.stp .dotc{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaeef6;color:var(--ink-3);border:2px solid #fff}
ol.stp .dotc svg{width:16px;height:16px}
ol.stp li.done .dotc{background:var(--accent);color:#fff}
ol.stp li.cur .dotc{background:#fff;color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 0 7px rgba(10,91,216,.15)}
ol.stp li.bad .dotc{background:var(--bad);color:#fff}
ol.stp b{font-weight:500}
ol.stp time{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.qcard{width:240px;flex:none;border-radius:12px;background:#f2f5fc;padding:12px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.qcard b{font-family:var(--f-mono);font-size:13px}
.qcard p{margin:0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qcard .pill{align-self:flex-start}

.fleet{position:absolute;right:16px;bottom:16px;width:418px;padding:12px;z-index:3;display:flex;flex-direction:column;max-height:calc(100% - 150px)}
.tabs{display:flex;align-items:center;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs button{height:30px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button span{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px;margin-left:4px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,36,90,.2)}
.tabs .where{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.rows{overflow:auto;min-height:0;max-height:204px}
.row{width:100%;display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;padding:8px 6px;border-radius:9px}
.row+.row{border-top:1px solid #edf0f6}
.row:hover{background:#f1f5fe}
.row.sel{background:var(--accent-soft)}
.row b{font-family:var(--f-mono);font-size:12px;display:block}
.row small{color:var(--ink-3);font-size:11px}
.rq{min-width:0}
.rq span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}

.tag{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(10,91,216,.4);white-space:nowrap}
.tag span{font-family:var(--f-body);font-weight:500;font-size:11px;background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);z-index:-1}
.tag.hov{background:#0d1530;font-family:var(--f-body);font-weight:500}

@media (max-width:1560px){.hint{display:none}}
@media (max-width:1240px){.user div{display:none}}
@media (max-width:1060px){.track{display:none}.live{display:none}.win{display:none}}
@media (max-width:760px){
  .search,.user{display:none}
  .brand small{display:none}
  .kpis{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .kpi{min-width:150px}
  .kpi .v b{font-size:19px}
  .ctl{top:auto;bottom:calc(34% + 32px);right:16px}
  .fleet{left:16px;right:16px;width:auto;max-height:34%}
  .detail{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:58%;z-index:6}
  .detail.ov{display:none}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="智慧客服即時題流 3D 畫面"></canvas>
  <div class="tag" id="tag" hidden></div>
  <div class="tag hov" id="hov" hidden></div>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="22" height="16" rx="5" fill="#0a5bd8"/><path d="M8 21v6l6-6" fill="#0a5bd8"/><rect x="12" y="11" width="18" height="13" rx="4.5" fill="#00b3c6"/><circle cx="17" cy="17.5" r="1.5" fill="#fff"/><circle cx="21" cy="17.5" r="1.5" fill="#fff"/><circle cx="25" cy="17.5" r="1.5" fill="#fff"/></svg>
      <div><b>智慧客服運營中心</b><small>市民提問 · 意圖路由 · 專業 Agent 監控</small></div>
    </div>
    <div class="search">
      <label><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋題號、提問內容、局處、Agent…" autocomplete="off"><kbd>/</kbd></label>
      <div class="pop card res" id="res" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="win" role="group" aria-label="統計區間"><button aria-pressed="true">今日</button><button aria-pressed="false">近 7 天</button><button aria-pressed="false">本月</button></div>
    <div class="live"><i></i>即時 <span class="mono" id="clock">--:--:--</span></div>
    <div class="user"><span class="avatar">林</span><div><b>值班人員 A</b><small>值班運營人員</small></div></div>
  </header>

  <section class="kpis" aria-label="今日指標">
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v11H9l-5 4z"/></svg></span><div><small>今日提問</small><div class="v"><b id="kTotal">0</b><em id="kTotalD"></em></div><small class="sub">LINE · 網站 · App · Kiosk</small></div></div>
    <div class="kpi card"><span class="ki g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5 9-10"/></svg></span><div><small>解決率</small><div class="v"><b id="kSolve">0</b><em id="kSolveD"></em></div><small class="sub">民眾未再追問或按有幫助</small></div></div>
    <div class="kpi card"><span class="ki o"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 13a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2v-6h3a7 7 0 0 0-14 0h3v6H6a2 2 0 0 1-2-2z"/></svg></span><div><small>轉真人率</small><div class="v"><b id="kHuman">0</b><em id="kHumanD"></em></div><small class="sub">轉接 1999 專人</small></div></div>
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity=".18"/><path d="M12 7v5l3 2"/></svg></span><div><small>平均回應</small><div class="v"><b id="kResp">0</b><em id="kRespD"></em></div><small class="sub">從進線到第一則回覆</small></div></div>
    <div class="hint">示範資料 · 點選題目、Agent、局處看詳情</div>
  </section>

  <nav class="ctl card" aria-label="視角控制">
    <button id="zin" aria-label="放大" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="縮小" title="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <hr>
    <button id="rl" aria-label="向左旋轉" title="向左旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button id="rr" aria-label="向右旋轉" title="向右旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
    <button id="home" aria-label="回到全景" title="回到全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/></svg></button>
  </nav>

  <aside class="detail card" id="detail" aria-live="polite"></aside>
  <section class="track card" id="track"></section>
  <section class="fleet card">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="flow" aria-selected="true">即時題流<span id="tFlow"></span></button>
      <button role="tab" data-tab="fix" aria-selected="false">待修復<span id="tFix"></span></button>
      <button role="tab" data-tab="kb" aria-selected="false">局處知識庫<span>33</span></button>
      <span class="where" id="tWhere">今日</span>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('scene');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pickW = arr => { let s = arr.reduce((a, x) => a + x.w, 0) * Math.random(); for (const x of arr) { s -= x.w; if (s <= 0) return x; } return arr[0]; };

/* ===== renderer ===== */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#c8d6ee');

  return `<div class="dh"><span class="ico" style="--c:#0a5bd8">${ico.intent}</span><div><div class="eyebrow">運營總覽 · 今日</div><h2>市府智慧客服</h2><p>4 個進線通道 · 5 個專業 Agent · 33 局處知識庫</p></div></div>
    <div class="dstate"><span class="pill good">系統正常</span><span>處理中 ${inflight} 題 · 平均判定 0.42 秒</span></div>
    <div class="tiles">
      <div class="tile"><small>解決率</small><b>${pct(stats.solved, total)}</b><span class="bar" style="--c:var(--good)"><i style="width:${100 * stats.solved / total}%"></i></span></div>
      <div class="tile"><small>未命中</small><b>${pct(stats.miss, total)}</b><span class="bar" style="--c:var(--bad)"><i style="width:${100 * stats.miss / total}%"></i></span></div>
      <div class="tile"><small>轉真人</small><b>${pct(stats.human, total)}</b><span class="bar" style="--c:var(--warn)"><i style="width:${100 * stats.human / total}%"></i></span></div>
      <div class="tile"><small>反問後解決</small><b>71.4%</b><span class="bar" style="--c:#f2a20c"><i style="width:71.4%"></i></span></div>
    </div>
    <div class="sec">Agent 分派<small>題數</small></div>
    ${units.map(u => `<div class="dist"><span><i class="dot" style="--c:${u.color}"></i>${u.short}</span><span class="bar" style="--c:${u.color}"><i style="width:${100 * stats.unit[u.id] / maxU}%"></i></span><b>${fmtN(stats.unit[u.id])}</b></div>`).join('')}
    <div class="sec">熱門意圖<small>題數</small></div>
    <ul class="lst">${intents.map(([k, v]) => `<li><span>${k}</span><b>${v}</b></li>`).join('')}</ul>
    <div class="sec">待修復原因<small>今日 ${stats.miss} 題</small></div>
    <ul class="lst">${fixes.map(([k, v]) => `<li><span>${k}</span><b>${v}</b></li>`).join('')}</ul>`;
}
function panelQ(r) {
  const tp = r.tp, [st, cls] = statusPill(r);
  const fixBox = tp.fix ? `<div class="fix"><h4>修復建議 · ${FIX[tp.fix].name}</h4><p>${tp.why}</p><div class="act"><span>${FIX[tp.fix].act}</span><button class="btn" id="dispatch" ${r.fixState === 'sent' ? 'disabled' : ''}>${r.fixState === 'sent' ? '已派工' : '建立修復工單'}</button></div></div>` : '';
  const ans = r.stage >= 3 ? `<div class="quote ans"><small>${tp.out === 'human' ? '轉接說明' : 'AI 回覆'}</small>${tp.a}</div>` : '';
  const ask = tp.ask && (r.asked || r.done) ? `<div class="quote ask"><small>反問民眾</small>${tp.ask}<br><small style="margin-top:4px">民眾補充：${tp.reply}</small></div>` : '';
  return `<div class="dh"><span class="ico" style="--c:${r.ch.color}">${ico.in}</span><div><div class="eyebrow">${r.ch.name}</div><h2 class="id">${r.id}</h2><p>${hhmmss(atDate(r))} 進線</p></div>${xBtn}</div>
    <div class="quote"><small>市民提問</small>${tp.q}</div>
    <div class="dstate"><span class="pill ${cls}">${st}</span>${r.stage >= 1 ? unitPill(r.unit) : ''}${tp.ask ? '<span class="pill u" style="--c:#f2a20c">經反問</span>' : ''}</div>
    ${ask}${ans}
    <dl class="kv">
      <dt>意圖</dt><dd>${r.stage >= 1 ? tp.intent : '判定中…'}</dd>
      <dt>信心分數</dt><dd>${r.stage >= 1 ? confRow(tp.conf) : '—'}</dd>
      <dt>分派 Agent</dt><dd>${r.stage >= 1 ? r.unit.name : '—'}</dd>
      <dt>主責局處</dt><dd>${r.bureau.name}</dd>
      <dt>引用來源</dt><dd>${r.stage >= 3 ? tp.cite : '—'}</dd>
      <dt>民眾回饋</dt><dd>${r.done ? r.feedback : '等待中'}</dd>
    </dl>${fixBox}`;
}
function panelUnit(u) {
  const recent = records.filter(r => r.unit === u || (u.id === 'ask' && r.tp.ask)).slice(0, 5);
  const ok = u.id === 'human' ? 96.8 : u.id === 'ask' ? 71.4 : u.id === 'api' ? 98.6 : u.id === 'flow' ? 91.2 : 84.7;
  return `<div class="dh"><span class="ico" style="--c:${u.color}">${ico.route}</span><div><div class="eyebrow" style="color:${u.color}">專業 Agent</div><h2>${u.name}</h2><p>${u.desc}</p></div>${xBtn}</div>
    <div class="tiles">
      <div class="tile"><small>今日處理</small><b>${fmtN(stats.unit[u.id])}</b><span>題</span></div>
      <div class="tile"><small>平均耗時</small><b>${u.avg.toFixed(1)}</b><span>秒</span></div>
      <div class="tile"><small>${u.id === 'human' ? '專人接起率' : u.id === 'ask' ? '反問後解決' : '解決率'}</small><b>${ok}%</b><span class="bar" style="--c:${u.color}"><i style="width:${ok}%"></i></span></div>
      <div class="tile"><small>處理中</small><b>${live.filter(r => !r.done && r.stage === 2 && r.unit === u).length}</b><span>題</span></div>
    </div>
    <div class="sec">最近題目<small>${recent.length} 題</small></div>
    <ul class="lst">${recent.map(r => `<li><span>${r.tp.q}</span><span class="pill ${statusPill(r)[1]}">${statusPill(r)[0]}</span></li>`).join('')}</ul>`;
}
function panelRouter() {
  const low = Math.round(stats.total * .072);
  return `<div class="dh"><span class="ico" style="--c:#0d1530">${ico.intent}</span><div><div class="eyebrow">Orchestrator</div><h2>意圖路由器</h2><p>判定意圖、依信心分數決定直接回答或先反問</p></div>${xBtn}</div>
    <div class="tiles">
      <div class="tile"><small>今日判定</small><b>${fmtN(stats.total)}</b><span>次</span></div>
      <div class="tile"><small>平均判定</small><b>0.42</b><span>秒</span></div>
      <div class="tile"><small>低信心改反問</small><b>${low}</b><span>次</span></div>
      <div class="tile"><small>處理中</small><b>${live.filter(r => !r.done && r.stage <= 1).length}</b><span>題</span></div>
    </div>
    <div class="sec">信心門檻<small>低於門檻一律先反問</small></div>
    <ul class="lst"><li><span>一般查詢（讀取資訊）</span><b>0.55</b></li><li><span>流程引導（資格判斷）</span><b>0.70</b></li><li><span>案件查詢（涉個資）</span><b>0.85</b></li><li><span>陳情檢舉</span><b>直接轉真人</b></li></ul>`;
}
function panelChannel(c) {
  const n = c.base + records.filter(r => r.ch === c).length;
  return `<div class="dh"><span class="ico" style="--c:${c.color}">${ico.in}</span><div><div class="eyebrow">進線通道</div><h2>${c.name}</h2><p>市民提問的入口之一</p></div>${xBtn}</div>
    <div class="tiles"><div class="tile"><small>今日進線</small><b>${fmtN(n)}</b><span>題</span></div><div class="tile"><small>占比</small><b>${c.w}%</b><span class="bar" style="--c:${c.color}"><i style="width:${c.w}%"></i></span></div><div class="tile"><small>尖峰時段</small><b>${c.id === 'kiosk' ? '10–11' : '12–13'}</b><span>時</span></div><div class="tile"><small>解決率</small><b>${c.id === 'web' ? '79.8' : c.id === 'kiosk' ? '76.2' : '83.6'}%</b></div></div>
    <div class="sec">最近提問</div><ul class="lst">${records.filter(r => r.ch === c).slice(0, 5).map(r => `<li><span>${r.tp.q}</span><span class="pill ${statusPill(r)[1]}">${statusPill(r)[0]}</span></li>`).join('')}</ul>`;
}
function panelBureau(b) {
  const open = records.filter(r => r.bureau === b && r.fixState === 'open');
  const meta = (ok, part) => ok ? '<span class="pill good">完整</span>' : part ? '<span class="pill warn">補建中</span>' : '<span class="pill bad">未建立</span>';
  return `<div class="dh"><span class="ico" style="--c:#4f7cff">${ico.ans}</span><div><div class="eyebrow">局處知識庫</div><h2>${b.name}</h2><p>最後更新 ${b.updated}</p></div>${xBtn}</div>
    <div class="dstate"><span class="pill ${b.misses >= 3 ? 'warn' : 'good'}">${b.misses >= 3 ? '需處理' : '正常'}</span><span>今日命中 ${b.hits} 次 · 未命中 ${b.misses} 次</span></div>
    <div class="tiles"><div class="tile"><small>知識筆數</small><b>${fmtN(b.docs)}</b><span>段</span></div><div class="tile"><small>命中率</small><b>${pct(b.hits, b.hits + b.misses)}</b><span class="bar" style="--c:var(--good)"><i style="width:${100 * b.hits / Math.max(1, b.hits + b.misses)}%"></i></span></div></div>
    <div class="sec">段落中繼資料<small>影響檢索準確度</small></div>
    <ul class="lst"><li><span>主題分類</span>${meta(true)}</li><li><span>局處標記</span>${meta(b.tagBureau, true)}</li><li><span>發布日期</span>${meta(b.tagDate, false)}</li></ul>
    <div class="sec">待修復題目<small>${open.length} 題</small></div>
    <ul class="lst">${open.length ? open.slice(0, 5).map(r => `<li><span>${r.tp.q}</span><span class="pill warn">${FIX[r.tp.fix].name}</span></li>`).join('') : '<li><span style="color:var(--ink-3)">目前沒有待修復題目</span></li>'}</ul>`;
}
function renderDetail() {
  const d = $('detail'); d.classList.toggle('ov', !sel);
  d.innerHTML = !sel ? panelOverview() : sel.kind === 'q' ? panelQ(sel) : sel.kind === 'unit' ? panelUnit(sel) : sel.kind === 'router' ? panelRouter() : sel.kind === 'channel' ? panelChannel(sel) : panelBureau(sel);
}
function featured() { return sel && sel.kind === 'q' ? sel : (live.filter(r => !r.done).sort((a, b) => b.stage - a.stage)[0] || records[0]); }
function renderTrack() {
  const r = featured(); if (!r) return;
  const names = ['進線', '意圖判定', `分派 · ${r.unit.short}`, r.tp.out === 'human' ? '轉接 1999' : '回覆', '民眾回饋'], keys = ['in', 'intent', 'route', 'ans', 'fb'];
  const tt = i => i === 0 ? hhmmss(atDate(r)) : i <= r.stage ? `+${stageT(r, i).toFixed(1)} 秒` : '—';
  const [st, cls] = statusPill(r);
  $('track').innerHTML = `<div class="steps"><div class="th"><h3>${ico.route}單題處理歷程</h3><small class="mono">${r.id} · ${r.ch.short}</small></div>
    <ol class="stp">${names.map((n, i) => { const c = i < r.stage || (r.done && i === 4) ? (r.done && i === 4 && r.tp.out === 'miss' ? 'bad' : 'done') : i === r.stage ? 'cur' : ''; return `<li class="${c}"><span class="dotc">${ico[keys[i]]}</span><b>${n}</b><time>${i === 4 && r.done ? r.feedback : tt(i)}</time></li>`; }).join('')}</ol></div>
    <button class="qcard" data-q="${r.id}"><b>${r.id}</b><p>${r.tp.q}</p><span class="pill ${cls}">${st}</span></button>`;
}
function renderRows() {
  let h = '';
  if (tab === 'flow') h = records.slice(0, 40).map(r => { const [st, cls] = statusPill(r); return `<button class="row ${r === sel ? 'sel' : ''}" data-q="${r.id}"><div><b>${r.id.slice(-4)}</b><small><i class="dot" style="--c:${r.ch.color}"></i>${r.ch.short}</small></div><div class="rq"><span>${r.tp.q}</span><small>${r.stage >= 1 ? r.tp.intent + ' → ' + r.unit.short : '意圖判定中'}</small></div><span class="pill ${cls}">${st}</span></button>`; }).join('');
  else if (tab === 'fix') h = records.filter(r => r.done && r.tp.fix).map(r => `<button class="row ${r === sel ? 'sel' : ''}" data-q="${r.id}"><div><b>${r.id.slice(-4)}</b><small>${r.bureau.name}</small></div><div class="rq"><span>${r.tp.q}</span><small>${FIX[r.tp.fix].name} · ${FIX[r.tp.fix].act}</small></div><span class="pill ${r.fixState === 'sent' ? 'mute' : 'warn'}">${r.fixState === 'sent' ? '已派工' : '待派工'}</span></button>`).join('') || '<div style="padding:14px;color:var(--ink-3)">目前沒有待修復題目</div>';
  else h = [...BUREAUS].sort((a, b) => b.misses - a.misses || b.hits - a.hits).map(b => `<button class="row ${b === sel ? 'sel' : ''}" data-b="${b.name}"><div><b style="font-family:var(--f-body)">${b.name.length > 5 ? b.name.slice(0, 5) + '…' : b.name}</b><small>${fmtN(b.docs)} 段</small></div><div class="rq"><span>命中 ${b.hits} · 未命中 ${b.misses}</span><small>局處標記 ${b.tagBureau ? '完整' : '補建中'} · 日期 ${b.tagDate ? '完整' : '未建立'}</small></div><span class="pill ${b.misses >= 3 ? 'warn' : 'good'}">${b.misses >= 3 ? '需處理' : '正常'}</span></button>`).join('');
  $('rows').innerHTML = h;
}
function renderTop() {
  const t = stats.total;
  $('kTotal').textContent = fmtN(t); $('kTotalD').textContent = '▲ 12%';
  $('kSolve').textContent = pct(stats.solved, t); $('kSolveD').textContent = '▲ 1.8%';
  $('kHuman').textContent = pct(stats.human, t); $('kHumanD').textContent = '▼ 0.6%';
  $('kResp').textContent = (2.2 + Math.sin(clock / 7) * .15).toFixed(1) + ' 秒'; $('kRespD').textContent = '▼ 0.3';
  $('tFlow').textContent = live.filter(r => !r.done).length; $('tFix').textContent = records.filter(r => r.done && r.fixState === 'open').length;
  BUREAUS.forEach(b => b.pin.visible = records.some(r => r.bureau === b && r.done && r.fixState === 'open'));
}
function renderUI() { renderTop(); renderDetail(); renderTrack(); renderRows(); }

const press = (el, fn) => { el.addEventListener('pointerdown', e => { if (e.button === 0) fn(e); }); el.addEventListener('click', e => { if (e.detail === 0) fn(e); }); };
const byQ = id => records.find(r => r.id === id);
press($('detail'), e => {
  if (e.target.closest('#close')) select(null);
  if (e.target.closest('#dispatch') && sel && sel.kind === 'q' && sel.fixState === 'open') { sel.fixState = 'sent'; renderUI(); }
});
press($('rows'), e => { const q = e.target.closest('[data-q]'), b = e.target.closest('[data-b]'); if (q) select(byQ(q.dataset.q)); if (b) select(B(b.dataset.b)); });
press($('track'), e => { const q = e.target.closest('[data-q]'); if (q) select(byQ(q.dataset.q)); });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); renderRows(); });

/* search */
function searchAll(q) {
  q = q.trim(); if (!q) return [];
  const out = [];
  Object.values(UNITS).forEach(u => (u.name.includes(q) || u.short.includes(q)) && out.push(['Agent', u, u.name, u.desc]));
  BUREAUS.forEach(b => b.name.includes(q) && out.push(['局處', b, b.name, `${fmtN(b.docs)} 段知識`]));
  records.forEach(r => (r.id.toLowerCase().includes(q.toLowerCase()) || r.tp.q.includes(q) || r.tp.intent.includes(q)) && out.push(['題目', r, r.id, r.tp.q]));
  return out.slice(0, 8);
}
$('q').addEventListener('input', () => {
  const r = searchAll($('q').value), bx = $('res'); bx._r = r;
  bx.innerHTML = r.length ? r.map(([k, , t, s], i) => `<button data-i="${i}"><span class="k">${k}</span><span><b>${t}</b> <small>${s}</small></span></button>`).join('') : '<div style="padding:10px;color:var(--ink-3)">找不到符合的項目</div>';
  bx.hidden = !$('q').value.trim();
});
press($('res'), e => { const b = e.target.closest('[data-i]'); if (!b) return; select($('res')._r[+b.dataset.i][1]); $('res').hidden = true; $('q').blur(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = searchAll($('q').value); if (r[0]) { select(r[0][1]); $('res').hidden = true; $('q').blur(); } } if (e.key === 'Escape') { $('res').hidden = true; $('q').blur(); } });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
const tick = () => $('clock').textContent = hhmmss(new Date()); tick(); setInterval(tick, 1000);

/* ===== loop ===== */
let clock = 0, spawnT = 0;
function sim(dt) {
  clock += dt; spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = .9 + Math.random() * .9; }
  stepTokens(dt);
  for (let i = beams.length - 1; i >= 0; i--) { const b = beams[i]; b.t += dt; b.m.material.opacity = Math.max(0, .9 - b.t / 1.6); if (b.t > 1.6) { scene.remove(b.m); b.m.geometry.dispose(); beams.splice(i, 1); } }
  BUREAUS.forEach(b => { if (b.flash > 0) { b.flash = Math.max(0, b.flash - dt); b.roof.material.emissive.set('#3cf0ff'); b.roof.material.emissiveIntensity = b.flash; } });
  laneMats.forEach(t => t.offset.x -= dt * 1.1);
  if (!reduceMotion) {
    R.rings[0].rotation.z += dt * 1.2; R.rings[1].rotation.z -= dt * .8; R.top.rotation.y += dt * 1.5;
    Object.values(UNITS).forEach((u, i) => { u.holo.rotation.y += dt * 1.4; u.holo.position.y = 5.2 + Math.sin(clock * 2 + i) * .25; });
    pins.forEach((p, i) => p.g.position.y = p.y + Math.sin(clock * 2.2 + i) * .25);
  }
}
for (let i = 0; i < 400; i++) sim(.04);

const tag = $('tag'), hov = $('hov');
let last = performance.now(), uiAcc = 0;
function placeTag(el, p, y) { const v = p.clone(); v.y = y; v.project(camera); el.style.transform = `translate(${(v.x + 1) / 2 * app.clientWidth}px,${(1 - v.y) / 2 * app.clientHeight}px) translate(-50%,calc(-100% - 6px))`; }
const nameOf = e => e.kind === 'q' ? e.id : e.name;
const tagY = e => e.kind === 'q' ? 1.9 : e.kind === 'unit' ? 6.4 : e.kind === 'router' ? 12 : e.kind === 'channel' ? 5.4 : e.h + (e.pin.visible ? 3.4 : 1);
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  sim(dt);
  const k = reduceMotion ? 1 : Math.min(1, dt * 5);
  view.az += (view.azTo - view.az) * k; view.zoom += (view.zoomTo - view.zoom) * k;
  if (view.follow) { if (view.follow.gone) view.follow = null; else view.target.lerp(view.follow.obj.position.clone().setY(0), reduceMotion ? 1 : Math.min(1, dt * 3)); }
  else if (view.goal) { view.target.lerp(view.goal, reduceMotion ? 1 : Math.min(1, dt * 3)); if (view.target.distanceTo(view.goal) < .05) view.goal = null; }
  updateCamera();

  const sp = sel ? entPos(sel) : null;
  if (sel && sp) {
    const fp = sel.kind === 'q' ? [1.9, 1.6] : sel.kind === 'unit' ? [8, 7.4] : sel.kind === 'router' ? [10.5, 10.5] : sel.kind === 'channel' ? [6.4, 5.8] : [4.4, 4.4];
    const pulse = 1 + (reduceMotion ? 0 : Math.sin(clock * 4) * .03);
    bracket.visible = true; bracket.position.set(sp.x, .08, sp.z); bracket.scale.set(fp[0] * pulse, fp[1] * pulse, 1);
    bracket.rotation.z = sel.kind === 'q' ? sel.obj.rotation.y : 0;
    tag.hidden = false; placeTag(tag, sp, tagY(sel));
    tag.innerHTML = sel.kind === 'q' ? `${sel.id}<span>${sel.done ? statusPill(sel)[0] : sel.status}</span>` : `${nameOf(sel)}`;
    tag.style.fontFamily = sel.kind === 'q' ? '' : 'var(--f-body)';
  } else { bracket.visible = false; tag.hidden = true; }
  if (hover && hover !== sel && !hover.gone) { const p = entPos(hover); if (p) { hov.hidden = false; placeTag(hov, p, tagY(hover)); hov.textContent = hover.kind === 'q' ? `${hover.id} · ${hover.tp.q.slice(0, 14)}…` : nameOf(hover); } else hov.hidden = true; }
  else hov.hidden = true;

  uiAcc += dt; if (uiAcc > .4) { uiAcc = 0; renderUI(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); renderUI(); requestAnimationFrame(frame);
})();
