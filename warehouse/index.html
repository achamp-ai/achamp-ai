<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>DockSight 物流場站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: five Taiwan sites laid along one highway; the isometric scene is the hero, instrument cards float at the corners */
:root{
  --sky:#c9d5ec;
  --panel:rgba(255,255,255,.96);
  --panel-line:#ffffff;
  --ink:#0d1530;
  --ink-2:#3b4664;
  --ink-3:#6b7593;
  --line:#d6deed;
  --accent:#1d54ff;
  --accent-soft:#dbe5ff;
  --good:#00965a;
  --good-soft:#d2f4e3;
  --warn:#e8650a;
  --warn-soft:#ffe6d2;
  --bad:#e0263b;
  --shadow:0 12px 32px rgba(20,36,90,.22),0 1px 3px rgba(20,36,90,.12);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--panel-line);box-shadow:var(--shadow);border-radius:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:8}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.search{position:relative;flex:1;max-width:420px}
.search label{display:flex;align-items:center;gap:8px;height:38px;padding-inline:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);font-size:13px}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.pop{position:absolute;top:calc(100% + 6px);padding:6px;z-index:9}
.res{left:0;right:0}
.res button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:8px;text-align:left}
.res button:hover,.res button.on{background:var(--accent-soft)}
.res small{color:var(--ink-3)}
.res .k{font-size:11px;color:var(--accent);font-weight:700}
.spacer{flex:1}
.sitebox{position:relative;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:#fff;height:44px}
.sitebtn{display:flex;align-items:center;gap:10px;padding:0 10px 0 6px;text-align:left;min-width:0}
.site-code{font-family:var(--f-mono);font-weight:700;font-size:11px;color:#fff;background:var(--accent);border-radius:7px;padding:6px 7px}
.sitebtn b{display:block;font-size:13px;white-space:nowrap}
.sitebtn small{color:var(--ink-3);font-size:11px;white-space:nowrap}
.sitebox .sep{border-left:1px solid var(--line);width:36px;display:grid;place-items:center;color:var(--ink-2)}
.sites{right:0;width:320px}
.sites button{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-align:left}
.sites button:hover,.sites button.on{background:var(--accent-soft)}
.sites b{display:block}
.sites small{color:var(--ink-3)}
.live{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:700;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,150,90,.5)}70%{box-shadow:0 0 0 7px rgba(0,150,90,0)}100%{box-shadow:0 0 0 0 rgba(0,150,90,0)}}
.bell{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.bell:hover{background:var(--accent-soft)}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.notes{right:0;width:320px;padding:8px}
.notes h4{margin:4px 6px 8px;font-size:13px}
.notes div{display:flex;gap:10px;padding:8px 6px;border-top:1px solid var(--line)}
.notes div span{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--c)}
.notes small{display:block;color:var(--ink-3);font-family:var(--f-mono)}
.user{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1d54ff,#6b93ff);color:#fff;font-weight:700}
.user b{display:block;font-size:13px}
.user small{color:var(--ink-3);font-size:11px}

/* KPI row */
.kpis{position:absolute;top:76px;left:16px;display:flex;gap:12px;z-index:3;max-width:calc(100% - 32px)}
.kpi{display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;min-width:190px}
.ki{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ki svg{width:22px;height:22px}
.kpi small{display:block;color:var(--ink-2);font-size:12px}
.kpi .v{display:flex;align-items:baseline;gap:8px;margin-block:1px}
.kpi .v b{font-family:var(--f-mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
.kpi .v em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--good);font-weight:700}
.kpi .sub{color:var(--ink-3);font-size:11px}
.hint{align-self:flex-start;color:var(--ink-2);font-size:11.5px;padding:6px 10px;white-space:nowrap;background:var(--panel);border-radius:999px;box-shadow:var(--shadow)}

/* map controls */
.ctl{position:absolute;top:76px;right:378px;display:flex;flex-direction:column;padding:4px;gap:2px;z-index:3}
.ctl button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.ctl button:hover{background:var(--accent-soft);color:var(--accent)}
.ctl svg{width:18px;height:18px}
.ctl hr{border:0;border-top:1px solid var(--line);margin:3px 6px}

/* detail panel */
.detail{position:absolute;top:76px;right:16px;width:350px;max-height:calc(100% - 330px);overflow:auto;padding:16px;z-index:4}
.dh{display:flex;gap:12px;align-items:center}
.dh .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#eef2fb;flex:none}
.dh .ico svg{width:30px;height:30px}
.dh .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.dh h2{margin:0;font-size:18px;line-height:1.3}
.dh h2.id{font-family:var(--f-mono);letter-spacing:-.01em}
.dh p{margin:0;color:var(--ink-3);font-size:12px}
.dh .acts{margin-left:auto;align-self:flex-start;display:flex;gap:4px}
.dh .acts button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.dh .acts button:hover{background:#eef2f9}
.dh .acts button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.dstate{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog .bar{flex:1}
.prog small{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.bar{display:block;height:6px;background:#e3e8f2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.good i{background:var(--good)}
.bar.warn i{background:var(--warn)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line)}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;text-align:right;font-weight:500;min-width:0}
dl.kv dd.link{color:var(--accent);font-family:var(--f-mono)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:#f3f6fc;border-radius:10px;padding:9px 10px}
.tile small{display:block;color:var(--ink-2);font-size:11.5px}
.tile b{font-family:var(--f-mono);font-size:17px}
.tile span{color:var(--ink-3);font-size:11.5px;margin-left:3px}
.tile .bar{margin-top:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700}
.sec small{font-weight:400;color:var(--ink-3)}
ul.inv{list-style:none;margin:0;padding:0}
ul.inv li{display:grid;grid-template-columns:22px 1fr auto 52px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #edf0f6}
ul.inv li:first-child{border-top:0}
ul.inv .sw{width:20px;height:20px;border-radius:6px;background:var(--c)}
ul.inv b{font-family:var(--f-mono);text-align:right}
ul.inv .pill{justify-content:center}
.flrow{display:grid;grid-template-columns:auto 1fr 70px auto;gap:10px;align-items:center;padding:6px 0;font-size:12px}
.flrow b{font-family:var(--f-mono)}
.flrow span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:#eaeef5;color:var(--ink-3)}

/* shipment tracking */
.track{position:absolute;left:16px;bottom:16px;width:min(780px,calc(100% - 446px));display:flex;gap:16px;padding:16px;z-index:3}
.track .steps{flex:1;min-width:0}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.th h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.th h3 svg{width:20px;height:20px;color:var(--accent)}
.th small{color:var(--ink-3)}
ol.stp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
ol.stp li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;font-size:12px}
ol.stp li::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#e0e6f1}
ol.stp li:first-child::before{display:none}
ol.stp li.done::before,ol.stp li.cur::before{background:var(--accent)}
ol.stp .dotc{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaeef6;color:var(--ink-3);border:2px solid #fff}
ol.stp .dotc svg{width:16px;height:16px}
ol.stp li.done .dotc{background:var(--accent);color:#fff}
ol.stp li.cur .dotc{background:#fff;color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 0 7px rgba(29,84,255,.15)}
ol.stp b{font-weight:500}
ol.stp time{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.ship{width:230px;flex:none;border-radius:12px;background:#f2f5fc;padding:12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.ship b{font-family:var(--f-mono);font-size:14px}
.ship small{color:var(--ink-2)}
.ship .pill{align-self:flex-start;margin-block:4px}

/* fleet list */
.fleet{position:absolute;right:16px;bottom:16px;width:398px;padding:12px;z-index:3;display:flex;flex-direction:column;max-height:calc(100% - 150px)}
.tabs{display:flex;align-items:center;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs button{height:30px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button span{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px;margin-left:4px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,36,90,.2)}
.tabs .where{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{overflow:auto;min-height:0}
.row{width:100%;display:grid;grid-template-columns:82px 1fr auto 60px;align-items:center;gap:10px;padding:8px 6px;border-radius:9px;text-align:left}
.row+.row{border-top:1px solid #edf0f6}
.row:hover{background:#f1f5fe}
.row.sel{background:var(--accent-soft)}
.row b{font-family:var(--f-mono);font-size:12.5px;display:block}
.row small{color:var(--ink-3);font-size:11px}
.rloc{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.rprog small{display:block;margin-top:4px;font-family:var(--f-mono);text-align:right}

/* floating tag */
.tag{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(29,84,255,.4);white-space:nowrap}
.tag span{font-family:var(--f-body);font-weight:500;font-size:11px;background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--accent);transform:translateX(-50%) rotate(45deg);z-index:-1}

@media (max-width:1240px){.user div,.hint{display:none}}
@media (max-width:1060px){.track{display:none}.live{display:none}}
@media (max-width:760px){
  .search,.user,.bell{display:none}
  .sitebtn small{display:none}
  .kpis{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .kpi{min-width:160px}
  .kpi .v b{font-size:19px}
  .ctl{top:auto;bottom:calc(34% + 32px);right:16px}
  .fleet{left:16px;right:16px;width:auto;max-height:34%}
  .detail{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:56%;z-index:6}
  .detail.site{display:none}
  .row{grid-template-columns:76px 1fr auto}
  .row .rprog{display:none}
  .sites{right:-40px;width:min(320px,calc(100vw - 32px))}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="物流場站 3D 即時畫面"></canvas>
  <div class="tag" id="tag" hidden></div>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 9.5v13L16 29 4 22.5v-13Z" fill="#1d54ff"/><path d="M16 3 28 9.5 16 16 4 9.5Z" fill="#6b93ff"/><path d="M16 16v13l12-6.5v-13Z" fill="#1238b8"/></svg>
      <span>DockSight</span>
    </div>
    <div class="search">
      <label><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋據點、車輛、堆高機、貨品、出貨單…" autocomplete="off"><kbd>/</kbd></label>
      <div class="pop card res" id="res" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="sitebox">
      <button class="sitebtn" id="siteBtn" aria-haspopup="true"><span class="site-code" id="siteCode">WH-01</span><div><b id="siteName">林口物流園區</b><small id="siteSub"></small></div></button>
      <button class="sep" id="siteNext" title="下一個據點" aria-label="下一個據點"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="pop card sites" id="siteMenu" hidden></div>
    </div>
    <div class="live"><i></i>即時 <span class="mono" id="clock">--:--</span></div>
    <div style="position:relative">
      <button class="bell" id="bell" aria-label="通知"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i></i></button>
      <div class="pop card notes" id="notes" hidden></div>
    </div>
    <div class="user"><span class="avatar">陳</span><div><b>陳以安</b><small>營運經理</small></div></div>
  </header>

  <section class="kpis" aria-label="據點指標">
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 21 6.5v11L12 22l-9-4.5v-11Z" opacity=".35"/><path d="M12 2 21 6.5 12 11 3 6.5Z"/><path d="M12 11v11l9-4.5v-11Z" opacity=".7"/></svg></span>
      <div><small>在庫棧板</small><div class="v"><b id="kStock">0</b><em id="kStockD"></em></div><small class="sub" id="kStockS"></small></div></div>
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3.5V16h-7z" opacity=".7"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></span>
      <div><small>場內車輛</small><div class="v"><b id="kTrucks">0</b><em id="kTrucksD"></em></div><small class="sub" id="kTrucksS"></small></div></div>
    <div class="kpi card"><span class="ki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity=".18"/><path d="M12 7v5l3 2"/></svg></span>
      <div><small>準時交貨率</small><div class="v"><b id="kOn">0</b><em id="kOnD"></em></div><small class="sub" id="kOnS"></small></div></div>
    <div class="hint">示範資料 · 拖曳平移、滾輪縮放、點選車輛／堆高機／貨品看詳情</div>
  </section>

  <nav class="ctl card" aria-label="視角控制">
    <button id="zin" title="放大" aria-label="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" title="縮小" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <hr>
    <button id="rl" title="向左旋轉" aria-label="向左旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button id="rr" title="向右旋轉" aria-label="向右旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
    <button id="home" title="回到據點全景" aria-label="回到據點全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/></svg></button>
  </nav>

  <aside class="detail card" id="detail" aria-live="polite"></aside>
  <section class="track card" id="track"></section>
  <section class="fleet card">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="docks" aria-selected="false">碼頭<span id="tDocks"></span></button>
      <button role="tab" data-tab="forklifts" aria-selected="false">堆高機<span id="tFl"></span></button>
      <button role="tab" data-tab="trucks" aria-selected="true">車輛<span id="tTr"></span></button>
      <span class="where" id="tWhere"></span>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('scene');

  load: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M9 6V4h6v2M4 11h16"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
};
function featured() { return sel && sel.kind === 'truck' ? sel : (cur.trucks.find(t => t.state === 'loading') || cur.trucks[0]); }
function renderTrack() {
  const tr = featured(), e = eta(tr), [st, cls] = ST[tr.state];
  let names, cur_, times;
  if (tr.dir === 'out') {
    names = ['訂單確認', '揀貨', `裝貨 ${tr.pal[0]}/${tr.pal[1]}`, '運送中', '已送達'];
    cur_ = tr.pal[0] >= tr.pal[1] ? 3 : 2;
    const etaLoad = new Date(Date.now() + (tr.pal[1] - tr.pal[0]) * 3.4 * TIME_SCALE * 1000);
    times = [tr.times[0], tr.times[1], `預計 ${fmt(etaLoad)}`, '—', '—'];
  } else {
    const unl = tr.state === 'unloading';
    names = ['訂單確認', '揀貨', '已裝車', '運送中', unl ? `卸貨 ${tr.pal[0]}/${tr.pal[1]}` : '已送達'];
    cur_ = moving(tr) ? 3 : (tr.pal[0] >= tr.pal[1] ? 5 : 4);
    times = [tr.times[0], tr.times[1], tr.times[2], tr.times[3], e ? `預計 ${fmt(e.at)}` : tr.times[3]];
  }
  const shipLine = e ? `${fmt(e.at)} 抵達 · 剩 ${e.min} 分` : `${tr.S.code} · ${tr.dk.label} · ${tr.pal[0]}/${tr.pal[1]} 棧板`;
  $('track').innerHTML = `<div class="steps"><div class="th"><h3>${ICONS.move}出貨追蹤</h3><small class="mono">${tr.id} · ${CARR[tr.c].name}</small></div>
    <ol class="stp">${names.map((n, i) => `<li class="${i < cur_ ? 'done' : i === cur_ ? 'cur' : ''}"><span class="dotc">${ICONS[['order', 'pick', 'load', 'move', 'done'][i]]}</span><b>${n}</b><time>${times[i] || '—'}</time></li>`).join('')}</ol></div>
    <button class="ship" data-id="${tr.id}"><b>${tr.shipment}</b><small>${tr.dir === 'out' ? '至 ' + tr.to : '至 ' + tr.S.code + ' ' + tr.S.name}</small><span class="pill ${cls}">${st}</span><small>${shipLine}</small></button>`;
}
function renderRows() {
  const S = cur; let html = '';
  if (tab === 'trucks') html = S.trucks.map(t => { const [st, cls] = ST[t.state], p = truckProg(t), c = CARR[t.c];
    return `<button class="row ${t === sel ? 'sel' : ''}" data-id="${t.id}"><div><b>${t.id}</b><small>${c.name}</small></div><div class="rloc"><i class="dot" style="--c:${c.color}"></i>${truckWhere(t)}</div><span class="pill ${cls}">${st}</span><div class="rprog"><span class="bar ${p.cls}"><i style="width:${p.pct.toFixed(0)}%"></i></span><small>${p.label}</small></div></button>`; }).join('');
  else if (tab === 'docks') { const L = { busy: ['作業中', 'good'], arriving: ['靠站中', 'acc'], reserved: ['已預約', 'warn'], free: ['空閒', 'mute'] };
    html = dockStates(S).map(({ d, s, tr }) => `<button class="row ${tr && tr === sel ? 'sel' : ''}" ${tr ? `data-id="${tr.id}"` : ''}><div><b>${d.label}</b><small>${S.code}</small></div><div class="rloc">${tr ? `<i class="dot" style="--c:${CARR[tr.c].color}"></i>${tr.id} · ${CARR[tr.c].name}` : '尚未指派車輛'}</div><span class="pill ${L[s][1]}">${L[s][0]}</span><div class="rprog">${tr && s === 'busy' ? `<span class="bar good"><i style="width:${(100 * tr.pal[0] / tr.pal[1]).toFixed(0)}%"></i></span><small>${tr.pal[0]}/${tr.pal[1]}</small>` : ''}</div></button>`).join(''); }
  else html = S.forklifts.map(f => { const [st, cls] = flState(f);
    return `<button class="row ${f === sel ? 'sel' : ''}" data-id="${f.id}"><div><b>${f.id}</b><small>${S.code}</small></div><div class="rloc">${f.task}</div><span class="pill ${cls}">${st}</span><div class="rprog"><span class="bar ${f.battery < 30 ? 'warn' : 'good'}"><i style="width:${f.battery.toFixed(0)}%"></i></span><small>${f.battery.toFixed(0)}%</small></div></button>`; }).join('');
  $('rows').innerHTML = html;
}
function renderTop() {
  const S = cur, busy = busyDocks(S);
  $('siteCode').textContent = S.code; $('siteName').textContent = S.name;
  $('siteSub').textContent = `${Math.round(100 * S.stock / S.cap)}% 滿載 · ${busy}/${S.docks.length} 碼頭作業中`;
  $('kStock').textContent = fmtN(S.stock); $('kStockD').textContent = `▲ ${S.dStock}`; $('kStockS').textContent = `棧板 · ${S.code}`;
  const n = onSite(S), inb = S.trucks.filter(t => t.dir === 'in' && moving(t)).length;
  $('kTrucks').textContent = n; $('kTrucksD').textContent = `▲ ${inb}`; $('kTrucksS').textContent = `${inb} 輛進場中 · ${S.code}`;
  $('kOn').textContent = S.on.toFixed(1) + '%'; $('kOnD').textContent = `▲ ${S.dOn}%`; $('kOnS').textContent = `近 30 天 · ${S.code}`;
  $('tDocks').textContent = `${busy}/${S.docks.length}`; $('tFl').textContent = `${S.forklifts.filter(f => f.mode === 'shuttle').length}/${S.forklifts.length}`; $('tTr').textContent = S.trucks.length; $('tWhere').textContent = S.name;
  SITES.forEach(X => dockStates(X).forEach(({ d, s }) => {
    const c = s === 'busy' ? '#22c07f' : s === 'arriving' ? '#f2a33a' : '#9aa3b6';
    d.light.material.color.set(c); d.light.material.emissive.set(s === 'free' || s === 'reserved' ? '#000000' : c); d.light.material.emissiveIntensity = .7;
  }));
}
function renderUI() { renderTop(); renderDetail(); renderTrack(); renderRows(); }

/* panels events */
const press = (el, fn) => { el.addEventListener('pointerdown', e => { if (e.button === 0) fn(e); }); el.addEventListener('click', e => { if (e.detail === 0) fn(e); }); };
press($('detail'), e => {
  if (e.target.closest('#close')) select(null);
  if (e.target.closest('#follow') && sel) { tracking = !tracking; if (tracking) { if (sel.kind === 'truck' || sel.kind === 'forklift') view.follow = sel; else view.goal = wpos(sel); } else view.follow = null; renderDetail(); }
});
const byId = id => ALL.find(e => e.id === id);
press($('rows'), e => { const r = e.target.closest('[data-id]'); if (r) select(byId(r.dataset.id)); });
press($('track'), e => { const r = e.target.closest('[data-id]'); if (r) select(byId(r.dataset.id)); });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); renderRows(); });

/* site menu */
function closePops() { ['siteMenu', 'notes', 'res'].forEach(id => $(id).hidden = true); }
$('siteBtn').onclick = e => {
  e.stopPropagation(); const m = $('siteMenu'), open = m.hidden; closePops();
  if (!open) return;
  m.innerHTML = SITES.map(S => `<button data-site="${S.code}" class="${S === cur ? 'on' : ''}"><span class="site-code">${S.code}</span><div><b>${S.name}</b><small>${S.type} · ${Math.round(100 * S.stock / S.cap)}% 滿載 · ${busyDocks(S)}/${S.docks.length} 碼頭作業中</small></div></button>`).join('');
  m.hidden = false;
};
$('siteMenu').onclick = e => { const b = e.target.closest('[data-site]'); if (!b) return; sel = null; setSite(SITES.find(S => S.code === b.dataset.site)); closePops(); };
$('siteNext').onclick = () => { sel = null; setSite(SITES[(SITES.indexOf(cur) + 1) % SITES.length]); };
$('bell').onclick = e => {
  e.stopPropagation(); const n = $('notes'), open = n.hidden; closePops(); if (!open) return;
  const ar = SITES.flatMap(S => S.trucks).find(t => t.state === 'enroute'), lo = SITES.flatMap(S => S.forklifts).sort((a, b) => a.battery - b.battery)[0];
  n.innerHTML = `<h4>通知</h4>
    <div style="--c:var(--warn)"><span></span><p style="margin:0">台中港配送中心「紙箱（大）」低於安全庫存<small>09:12</small></p></div>
    <div style="--c:var(--accent)"><span></span><p style="margin:0">${ar ? `${ar.id} 預計 ${eta(ar).min} 分後抵達${ar.S.name} ${ar.dk.label}` : '目前無車輛進場'}<small>${fmt(new Date())}</small></p></div>
    <div style="--c:var(--good)"><span></span><p style="margin:0">${lo.id} 電量 ${lo.battery.toFixed(0)}%，${lo.mode === 'charge' ? '充電中' : '建議排程充電'}<small>${fmt(new Date())}</small></p></div>`;
  n.hidden = false;
};
document.addEventListener('click', e => { if (!e.target.closest('.pop,#siteBtn,#bell,.search')) closePops(); });

/* search */
const KIND = { truck: '車輛', forklift: '堆高機', item: '貨品', charger: '充電座', site: '據點' };
function searchIdx(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  return ALL.filter(e => [e.id, e.code, e.name, e.driver, e.shipment, e.customer, e.sku, e.c && CARR[e.c].name].filter(Boolean).join(' ').toLowerCase().includes(q)).slice(0, 7);
}
$('q').addEventListener('input', () => {
  const r = searchIdx($('q').value), box_ = $('res');
  if (!r.length) { box_.hidden = !$('q').value.trim(); box_.innerHTML = '<div style="padding:10px;color:var(--ink-3)">找不到符合的項目</div>'; return; }
  box_.innerHTML = r.map((e, i) => `<button data-i="${i}" class="${i ? '' : 'on'}"><span class="k">${KIND[e.kind]}</span><span><b class="mono">${e.kind === 'site' ? e.code : e.kind === 'item' ? e.name : e.id}</b> <small>${e.kind === 'site' ? e.name : e.kind === 'truck' ? e.shipment + ' · ' + e.customer : e.kind === 'item' ? e.sku : e.driver || ''}</small></span><small>${e.kind === 'site' ? '' : e.S.code}</small></button>`).join('');
  box_.hidden = false; box_._r = r;
});
$('res').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; select($('res')._r[+b.dataset.i]); closePops(); $('q').blur(); };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = searchIdx($('q').value); if (r[0]) { select(r[0]); closePops(); $('q').blur(); } } if (e.key === 'Escape') { closePops(); $('q').blur(); } });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });

const tick = () => { $('clock').textContent = fmt(new Date()); }; tick(); setInterval(tick, 1000);

/* ================= simulation ================= */
let clock = 0;
function stepTruck(tr, dt) {
  if (moving(tr)) {
    const s = tr.pos, gateZone = !s.rev && s.z < 12.6 && s.z > 9.6 && s.x > 18;
    const want = s.rev ? 1.7 : (s.z > 12.4 ? 8.5 : 3.2);
    tr.v += (want - tr.v) * Math.min(1, dt * 1.6);
    tr.t += tr.v * dt;
    if (tr.t >= tr.path.len) { tr.t = tr.path.len; tr.state = tr.dir === 'in' ? 'unloading' : 'loading'; tr.v = 0; tr.timer = 0; tr.pal[0] = 0; }
    else tr.state = s.rev ? 'docking' : gateZone ? 'gate' : 'enroute';
    placeTruck(tr);
  } else {
    tr.v = 0; tr.timer += dt;
    if (tr.pal[0] < tr.pal[1]) { if (tr.timer > 3.6) { tr.pal[0]++; tr.timer = 0; } }
    else if (tr.timer > 7) {
      if (tr.mover) { tr.t = 0; tr.si = 0; tr.state = 'enroute'; tr.pal[0] = 0; tr.times[3] = fmt(new Date()); }
      else tr.pal[0] = 0;
      tr.timer = 0; placeTruck(tr);
    }
  }
}
function stepForklift(f, dt) {
  f.speed = 0;
  if (f.mode === 'charge') { f.battery = Math.min(100, f.battery + dt * .25); return; }
  if (f.mode !== 'shuttle') return;
  if (f.pause > 0) { f.pause -= dt; return; }
  const p = f.obj.position, dx = f.to.x - p.x, dz = f.to.z - p.z, L = Math.hypot(dx, dz);
  if (L < .15) {
    f.carrying = f.to === f.A; f.obj.userData.load.visible = f.carrying;
    if (f.to === f.B) f.moves++;
    f.to = f.to === f.A ? f.B : f.A; f.pause = 1.3; return;
  }
  const want = Math.atan2(-dz, dx); f.h = lerpAng(f.h, want, Math.min(1, dt * 4)); f.obj.rotation.y = f.h;
  const aligned = Math.abs(lerpAng(0, want - f.h, 1)) < .3, sp = (aligned ? 2.4 : .5) * dt;
  p.x += Math.cos(f.h) * Math.min(sp, L); p.z -= Math.sin(f.h) * Math.min(sp, L);
  f.speed = aligned ? 8.2 : 2; f.battery = Math.max(18, f.battery - dt * .03);
}
function stepAmr(a, dt) {
  const P = a.pts, A = P[a.seg], B = P[(a.seg + 1) % 4], L = A.distanceTo(B);
  a.u += dt * 2.2 / L; if (a.u >= 1) { a.u -= 1; a.seg = (a.seg + 1) % 4; }
  const A2 = P[a.seg], B2 = P[(a.seg + 1) % 4];
  a.g.position.set(A2.x + (B2.x - A2.x) * a.u, 0, A2.z + (B2.z - A2.z) * a.u);
  a.h = lerpAng(a.h, Math.atan2(-(B2.z - A2.z), B2.x - A2.x), Math.min(1, dt * 6)); a.g.rotation.y = a.h;
}
function buildRibbon(S, tr) {
  const pos = [], P = tr.path.S, w = .55, y = .05;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i].p, b = P[i + 1].p, dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1, nx = -dz / L * w, nz = dx / L * w;
    pos.push(a.x + nx, y, a.z + nz, a.x - nx, y, a.z - nz, b.x + nx, y, b.z + nz, a.x - nx, y, a.z - nz, b.x - nx, y, b.z - nz, b.x + nx, y, b.z + nz);
  }
  S.ribbon.geometry.dispose(); S.ribbon.geometry = new THREE.BufferGeometry();
  S.ribbon.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); S.ribbon.userData.tr = tr;
}

const tag = $('tag');
let last = performance.now(), uiAcc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  SITES.forEach(S => { S.trucks.forEach(t => stepTruck(t, dt)); S.forklifts.forEach(f => stepForklift(f, dt)); S.amrs.forEach(a => stepAmr(a, dt)); });
  if (!reduceMotion) pins.forEach((p, i) => { p.g.position.y = p.y + Math.sin(clock * 2.2 + i) * .28; p.g.rotation.y += dt; });

  const k = reduceMotion ? 1 : Math.min(1, dt * 5);
  view.az += (view.azTo - view.az) * k; view.zoom += (view.zoomTo - view.zoom) * k;
  if (view.follow) view.target.lerp(view.follow.obj.getWorldPosition(new THREE.Vector3()).setY(0), reduceMotion ? 1 : Math.min(1, dt * 2.5));
  else if (view.goal) { view.target.lerp(view.goal, reduceMotion ? 1 : Math.min(1, dt * 3)); if (view.target.distanceTo(view.goal) < .05) view.goal = null; }
  updateCamera();
  SITES.forEach(S => S.g.visible = Math.abs(S.g.position.x - view.target.x) < 125);

  SITES.forEach(S => S.ribbon.visible = false);
  if (sel && sel.kind === 'truck' && moving(sel)) {
    const S = sel.S; if (S.ribbon.userData.tr !== sel) buildRibbon(S, sel);
    S.ribbon.visible = true; S.ribbon.geometry.setDrawRange(sel.si * 6, Infinity);
  }
  if (sel) {
    const p = sel.obj.getWorldPosition(new THREE.Vector3());
    bracket.visible = true; bracket.position.set(p.x, .07, p.z); bracket.rotation.y = sel.obj.rotation.y;
    const pulse = 1 + (reduceMotion ? 0 : Math.sin(clock * 4) * .025);
    bracket.scale.set(sel.fp[0] * pulse, 1, sel.fp[1] * pulse);
    const tp = p.clone(); tp.y = sel.tagY; tp.project(camera);
    tag.hidden = false; tag.style.transform = `translate(${(tp.x + 1) / 2 * app.clientWidth}px,${(1 - tp.y) / 2 * app.clientHeight}px) translate(-50%,calc(-100% - 6px))`;
    const st = sel.kind === 'truck' ? ST[sel.state][0] : sel.kind === 'forklift' ? flState(sel)[0] : sel.kind === 'item' ? sel.status : (sel.fl ? '充電中' : '空閒');
    tag.innerHTML = `${sel.kind === 'item' ? sel.name : sel.id}<span>${st}</span>`;
  } else { bracket.visible = false; tag.hidden = true; }

  uiAcc += dt; if (uiAcc > .3) { uiAcc = 0; renderUI(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
renderUI();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
